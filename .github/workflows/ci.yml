name: ledger-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Two commits, so that the first parent is available to the
          # append-only step below.  On a pull request the checked-out commit
          # is the merge result and its first parent is the base branch.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate ledgers (base + shards)
        run: python3 tools/validate_seed.py

      # Every other step parses a row before looking at it, so a re-serialised
      # or edited row passes them.  This one compares bytes: each ledger line of
      # the base must still be present.  It runs where the base is main (pull
      # requests, and pushes to main); a branch may still fix rows of its own
      # that have not reached main.  There is no override: when a human has
      # approved changing a row, this step stays red and lists what changes.
      - name: Check that no ledger line on the base was rewritten or removed
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: python3 tools/append_only_check.py --base HEAD^1

      - name: Check READING_MAP.md is current
        run: python3 tools/inspect_inquiry.py --check-map

      - name: Check the readings/ note index section
        run: python3 tools/note_index.py --check

      - name: Check size budgets
        run: python3 tools/size_budget.py

      - name: Measure associations from read_log (advisory, writes nothing)
        run: python3 tools/associations.py --json --limit 1 > /dev/null

      - name: Check read_log coverage
        run: python3 tools/read_log_backfill.py --check

      - name: Check viewer JavaScript syntax
        run: node --check viewer/app.js

      # Advisory observations: these two tools write nothing, so a failure here
      # means the tool itself broke, not that the archive is wrong.  They are
      # listed so that a drift in the time axis or in the inheritance count is
      # visible in CI instead of only in a session's own report.
      - name: Observe the time axis (advisory)
        run: python3 tools/date_axis.py --check

      - name: Observe inheritance over readings/ (advisory)
        run: python3 tools/inheritance.py --cohorts

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
