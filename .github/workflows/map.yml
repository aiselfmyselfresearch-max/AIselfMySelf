name: build-reading-map

# Tier 4 of the data architecture (docs/map-architecture.md): publish the full
# sharded reading map as a workflow artifact so the generated documents stay out
# of git history while remaining downloadable.  map/ is gitignored on purpose.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sharded reading map
        run: python3 tools/map_build.py --report

      - name: Validate ledgers before publishing
        run: python3 tools/validate_seed.py

      # map/ is the artifact's payload, and tools/associations.py also writes
      # there (map/associations.md).  Generating it here keeps the published
      # artifact complete; map_build.py only prunes its own NN-*.md shards, so
      # the two generators coexist.
      - name: Measure associations into map/ (advisory, no ledger writes)
        run: python3 tools/associations.py --write-map

      - name: Render posterior belief state into map/
        run: python3 tools/belief_state.py --write-map && git checkout -- BELIEF_MAP.md

      - name: Upload reading-map artifact
        uses: actions/upload-artifact@v4
        with:
          name: reading-map
          path: map/
          compression-level: 6
          retention-days: 90
